[package]
name = "sdr-remote-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ThetisLink-Client"
path = "src/main.rs"

[dependencies]
sdr-remote-core = { path = "../sdr-remote-core", features = ["audio-stream"] }
sdr-remote-relay = { path = "../sdr-remote-relay" }
sdr-remote-chat = { path = "../sdr-remote-chat" }
sdr-remote-logic = { path = "../sdr-remote-logic" }
tokio = { workspace = true }
cpal = { workspace = true }
ringbuf = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
sdr-remote-theme = { path = "../sdr-remote-theme" }
sdr-remote-layout = { path = "../sdr-remote-layout" }
log = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
anyhow = { workspace = true }
midir = { workspace = true }
# The Morse paddle on an MCP2221A (src/paddle.rs). Same crate the server uses
# for its tuner and rotor bridges; resolved to vendor/mcp2221-hal by the
# workspace patch.
mcp2221-hal = "0.1"
open = "5"
chrono = "0.4"
# Exactly 3.1.3: from that release on the i18n! macro writes its tables in a
# fixed order (BTreeMap); before it every fresh build came out different. 3.1.4
# swaps the YAML parser, and that waits for its own round with every language
# checked on every screen.
rust-i18n = "=3.1.3"
# mDNS service browse for local-network server discovery.
# Same crate + version as the server side - see server Cargo.toml.
mdns-sd = "=0.19.1"
# The transmit spectrum of a Yaesu (src/ui/tx_spectrum.rs). Same crate and
# version as vrx-rs and the server.
rustfft = "6"

[features]
default = []
# Enable in-memory UiEvent recording + env-var gated test harness for unit/integration tests.
ui-test = []
# Emit ui-coverage.json at build/init time for the controls registration gate.
ui-coverage = []

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
    # The Bluetooth PTT button (src/ble.rs): WinRT rather than a new crate, so
    # nothing enters the workspace or the SBOM for it.
    "Devices_Bluetooth",
    "Devices_Bluetooth_Advertisement",
    "Devices_Bluetooth_GenericAttributeProfile",
    "Devices_Enumeration",
    "Foundation",
    "Foundation_Collections",
    "Storage_Streams",
] }
# The CatSync WebSDR window (src/websdr.rs): only the Windows branch embeds a
# WebView; macOS and Linux open the system browser. Here rather than for every
# platform, so the Linux build needs no GTK or WebKitGTK.
wry = "0.54"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
