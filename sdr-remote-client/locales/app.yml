# --- screens.rs (Spike protection) ---
screen_builtin_speaker_mic:
  en: "Built-in speaker + mic (PTT spike protection)"
  nl: "Ingebouwde luidspreker + mic (PTT-spike-bescherming)"
  de: "Eingebauter Lautsprecher + Mic (PTT-Spike-Schutz)"
  fr: "Haut-parleur + micro intégrés (protection contre le pic PTT)"
screen_builtin_speaker_mic_tooltip:
  en: "For tablets/laptops where the built-in speaker and mic share one chassis. On PTT the speaker is muted instantly and the first few ms of mic are discarded, so the switch-on spike is not transmitted. Leave off for a headset or well-isolated audio (0 ms, no added latency)."
  nl: "Voor tablets/laptops waar de ingebouwde luidspreker en mic in één behuizing zitten. Bij PTT wordt de luidspreker direct gedempt en worden de eerste paar ms van de mic weggegooid, zodat de inschakel-spike niet wordt uitgezonden. Laat uit voor een headset of goed geïsoleerde audio (0 ms, geen extra latency)."
  de: "Für Tablets/Laptops, bei denen der eingebaute Lautsprecher und das Mic in einem Gehäuse sitzen. Bei PTT wird der Lautsprecher sofort stummgeschaltet und die ersten paar ms des Mics verworfen, sodass der Einschalt-Spike nicht gesendet wird. Bei einem Headset oder gut isolierter Audio aus lassen (0 ms, keine zusätzliche Latenz)."
  fr: "Pour les tablettes/portables où le haut-parleur et le micro intégrés partagent un même châssis. En PTT, le haut-parleur est coupé instantanément et les premières ms du micro sont ignorées, afin que le pic d'enclenchement ne soit pas transmis. Laissez désactivé pour un casque ou un audio bien isolé (0 ms, aucune latence ajoutée)."
screen_mic_gate_delay_thetis:
  en: "Mic gate-delay Thetis:"
  nl: "Mic gate-delay Thetis:"
  de: "Mic-Gate-Delay Thetis:"
  fr: "Délai de gate micro Thetis :"
screen_mic_gate_delay_yaesu:
  en: "Mic gate-delay Yaesu:"
  nl: "Mic gate-delay Yaesu:"
  de: "Mic-Gate-Delay Yaesu:"
  fr: "Délai de gate micro Yaesu :"
screen_gate_delay_hint:
  en: "Thetis is usually clean at 0 ms; Yaesu around 100 ms."
  nl: "Thetis is meestal schoon bij 0 ms; Yaesu rond 100 ms."
  de: "Thetis ist meist bei 0 ms sauber; Yaesu bei etwa 100 ms."
  fr: "Thetis est généralement propre à 0 ms ; Yaesu autour de 100 ms."

