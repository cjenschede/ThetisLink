# --- screens.rs (Data-saving / VRX rate) ---
screen_receive_dx_spots:
  en: "Receive DX spots"
  nl: "DX-spots ontvangen"
  de: "DX-Spots empfangen"
  fr: "Recevoir les spots DX"
screen_full_spectrum_row:
  en: "Full-band spectrum row per (V)RX chain"
  nl: "Volbandspectrumrij per (V)RX-keten"
  de: "Vollband-Spektrumzeile pro (V)RX-Kette"
  fr: "Ligne de spectre pleine bande par chaîne (V)RX"
screen_full_spectrum_row_hover:
  en: "One extra full-DDC row per chain, shared by RX1+VRX1 and by RX2+VRX2. Keeps the waterfall history filled after tuning or zooming, and holds the plot steady while tuning fast. Off: every waterfall follows its own view, at roughly half the spectrum data."
  nl: "Eén extra volledige DDC-rij per keten, gedeeld door RX1+VRX1 en door RX2+VRX2. Houdt de watervalhistorie gevuld na afstemmen of zoomen, en houdt het plaatje rustig tijdens snel afstemmen. Uit: elke waterval volgt zijn eigen weergave, met ongeveer de helft van de spectrumdata."
  de: "Eine zusätzliche Voll-DDC-Zeile pro Kette, gemeinsam genutzt von RX1+VRX1 und von RX2+VRX2. Hält den Wasserfallverlauf nach Abstimmen oder Zoomen gefüllt und die Anzeige beim schnellen Abstimmen ruhig. Aus: jeder Wasserfall folgt seiner eigenen Ansicht, mit etwa halb so vielen Spektrumdaten."
  fr: "Une ligne DDC complète supplémentaire par chaîne, partagée par RX1+VRX1 et par RX2+VRX2. Garde l'historique de la cascade rempli après un accord ou un zoom, et stabilise le tracé pendant l'accord rapide. Désactivé : chaque cascade suit sa propre vue, avec environ moitié moins de données spectre."
screen_wideband_thetis_audio:
  en: "Wideband Thetis audio (FM/AM clearer, ~2x data)"
  nl: "Breedband Thetis-audio (FM/AM helderder, ~2x data)"
  de: "Breitband-Thetis-Audio (FM/AM klarer, ~2x Daten)"
  fr: "Audio Thetis large bande (FM/AM plus clair, ~2x de données)"
screen_vrx1_rate:
  en: "VRX1 rate:"
  nl: "VRX1-rate:"
  de: "VRX1-Rate:"
  fr: "Débit VRX1 :"
screen_vrx2_rate:
  en: "VRX2 rate:"
  nl: "VRX2-rate:"
  de: "VRX2-Rate:"
  fr: "Débit VRX2 :"
screen_vrx_rate_tooltip:
  en: "Per-VRX audio sample rate. Auto: 16 kHz when that VRX's filter is >=4 kHz wide, else 8 kHz. Independent per client."
  nl: "Audio-samplerate per VRX. Auto: 16 kHz als het filter van die VRX >=4 kHz breed is, anders 8 kHz. Onafhankelijk per client."
  de: "Audio-Abtastrate pro VRX. Auto: 16 kHz, wenn der Filter dieses VRX >=4 kHz breit ist, sonst 8 kHz. Unabhängig pro Client."
  fr: "Fréquence d'échantillonnage audio par VRX. Auto : 16 kHz lorsque le filtre de ce VRX fait >=4 kHz de large, sinon 8 kHz. Indépendant par client."

