screen_audio_levels_hover:
  en: "Receive bars show the level as received, before the volume sliders. The mic bar shows what is transmitted, after gain and compressor."
  nl: "De ontvangstbalken tonen het niveau zoals ontvangen, vóór de volumeschuiven. De mic-balk toont wat er uitgezonden wordt, ná gain en compressor."
  de: "Die Empfangsbalken zeigen den Pegel wie empfangen, vor den Lautstärkereglern. Der Mic-Balken zeigt, was gesendet wird, nach Gain und Kompressor."
  fr: "Les barres de réception montrent le niveau tel que reçu, avant les curseurs de volume. La barre micro montre ce qui est émis, après gain et compresseur."
dev_mem_tone_write_hint:
  en: "Written to the radio with \"Write to radio\": the channel is briefly recalled, because the tone is not part of the memory write itself"
  nl: "Wordt met \"Schrijf naar radio\" opgeslagen: het kanaal wordt daarbij even opgeroepen, want de toon zit niet in het geheugenschrijfcommando zelf"
  de: "Wird mit \"Ins Funkgerät schreiben\" gespeichert: der Kanal wird dabei kurz aufgerufen, denn der Ton ist nicht Teil des Speicherbefehls"
  fr: "Enregistré avec \"Écrire dans la radio\" : le canal est rappelé brièvement, car la tonalité ne fait pas partie de la commande d'écriture mémoire"
dev_read_tones:
  en: "Read tones"
  nl: "Tonen uitlezen"
  de: "Töne auslesen"
  fr: "Lire les tonalités"
dev_read_tones_hover:
  en: "Reads the CTCSS/DCS tone of every channel that has a tone mode. The radio briefly steps through those channels and returns where it was. Read the memories first."
  nl: "Leest de CTCSS/DCS-toon van elk kanaal met een toonmodus. De radio loopt die kanalen even langs en gaat daarna terug naar waar hij stond. Lees eerst de geheugens in."
  de: "Liest den CTCSS/DCS-Ton jedes Kanals mit Tonmodus. Das Funkgerät geht diese Kanäle kurz durch und kehrt danach zurück. Zuerst die Speicher einlesen."
  fr: "Lit la tonalité CTCSS/DCS de chaque canal doté d'un mode tonalité. La radio parcourt brièvement ces canaux puis revient. Lisez d'abord les mémoires."
dev_mem_field_not_stored:
