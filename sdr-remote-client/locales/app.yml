  fr: "Enregistré - redémarrez le client pour cesser d'utiliser le relais"
screen_relay_saved_connect:
  en: "Saved - restart the client to connect via relay"
  nl: "Opgeslagen - herstart de client om via de relay te verbinden"
  de: "Gespeichert - Client neu starten, um über das Relay zu verbinden"
  fr: "Enregistré - redémarrez le client pour vous connecter via le relais"
screen_relay_off_direct:
  en: "Off (direct connection)"
  nl: "Uit (directe verbinding)"
  de: "Aus (direkte Verbindung)"
  fr: "Désactivé (connexion directe)"
screen_relay_description:
  en: "The relay routes your whole connection (audio, control, PTT) so a client without port-forwarding can reach the server. Turning this on/off takes effect after restarting the client."
  nl: "De relay routeert je hele verbinding (audio, besturing, PTT) zodat een client zonder port-forwarding de server kan bereiken. Dit aan/uit zetten wordt actief na het herstarten van de client."
  de: "Das Relay leitet Ihre gesamte Verbindung (Audio, Steuerung, PTT) weiter, damit ein Client ohne Port-Weiterleitung den Server erreichen kann. Das Ein-/Ausschalten wird nach dem Neustart des Clients wirksam."
  fr: "Le relais achemine toute votre connexion (audio, contrôle, PTT) afin qu'un client sans redirection de port puisse atteindre le serveur. L'activation/désactivation prend effet après le redémarrage du client."

