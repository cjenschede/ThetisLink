  de: "Audio über UDP (niedrige Latenz)"
  fr: "Audio via UDP (faible latence)"
screen_audio_over_udp_tooltip:
  en: "Route audio + PTT over plain UDP (port 443) instead of the wss tunnel: no retransmit, lower and steadier latency. Both this client and the server must have it on. Applies on restart."
  nl: "Stuur audio + PTT over kale UDP (poort 443) in plaats van de wss-tunnel: geen retransmit, lagere en stabielere latency. Zowel deze client als de server moeten dit aan hebben. Wordt actief na herstart."
  de: "Audio + PTT über reines UDP (Port 443) statt über den wss-Tunnel leiten: keine erneute Übertragung, niedrigere und stabilere Latenz. Sowohl dieser Client als auch der Server müssen es aktiviert haben. Wird nach Neustart wirksam."
  fr: "Acheminer l'audio + PTT via UDP brut (port 443) au lieu du tunnel wss : pas de retransmission, latence plus faible et plus stable. Ce client et le serveur doivent tous deux l'activer. Prend effet au redémarrage."
