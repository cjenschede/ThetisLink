dev_mem_offset_readonly:
  en: "Read-only. The shift size is not stored per memory channel on either radio - the channel holds only the direction, and the size is a per-band menu setting (FT-991A 80-83, FTX-1 EX 010316-010319). The value shown is transmit minus receive frequency."
  nl: "Alleen-lezen. De grootte van de shift staat bij geen van beide radio's in het geheugenkanaal - daar staat alleen de richting; de grootte is een menu-instelling per band (FT-991A 80-83, FTX-1 EX 010316-010319). De getoonde waarde is zend- min ontvangfrequentie."
  de: "Nur Anzeige. Die Groesse des Shifts steht bei keinem der beiden Geraete im Speicherkanal - dort steht nur die Richtung; die Groesse ist eine Menueeinstellung pro Band (FT-991A 80-83, FTX-1 EX 010316-010319). Angezeigt wird Sende- minus Empfangsfrequenz."
  fr: "Lecture seule. La taille du decalage n'est stockee dans la memoire sur aucun des deux postes - la memoire ne retient que le sens ; la taille est un reglage de menu par bande (FT-991A 80-83, FTX-1 EX 010316-010319). La valeur affichee est la frequence d'emission moins celle de reception."
dev_mem_click_to_recall:
  en: "Click to put the radio on this channel, double-click to edit the row. Green = the radio is here now, amber = the channel you left when you tuned into VFO."
  nl: "Klik om de radio op dit kanaal te zetten, dubbelklik om de rij te bewerken. Groen = de radio staat hier nu, oranje = het kanaal dat je verliet toen je naar VFO ging."
  de: "Klicken, um das Geraet auf diesen Kanal zu setzen, Doppelklick zum Bearbeiten der Zeile. Gruen = das Geraet ist jetzt hier, Orange = der Kanal, den Sie beim Wechsel auf VFO verlassen haben."
  fr: "Cliquez pour placer le poste sur cette memoire, double-cliquez pour modifier la ligne. Vert = le poste y est actuellement, orange = la memoire quittee en passant en VFO."
