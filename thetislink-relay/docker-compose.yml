services:
  thetislink-relay:
    build:
      context: .
      dockerfile: Dockerfile
    image: thetislink-relay:dev
    container_name: thetislink-relay
    restart: unless-stopped
    environment:
      THETISLINK_RELAY_TOKEN: ${THETISLINK_RELAY_TOKEN:?set THETISLINK_RELAY_TOKEN in .env}
      # Persistent station registry (Fase 1 auth). Empty registry -> legacy token mode.
      THETISLINK_RELAY_DB: /data/stations.db
      RUST_LOG: ${RUST_LOG:-info}
      # PATCH-relay-audio-udp fase 2: bind the kale-UDP audio data path. Audio + PTT
      # travel over UDP (no retransmit); control/spectrum stay on wss via Caddy.
      THETISLINK_RELAY_UDP_LISTEN: 0.0.0.0:443
      # The relay signs chat tickets with this; the chat verifies with the same
      # value (design §3.3). Optional: without it the relay simply offers no
      # ticket, which is a relay with no chat behind it.
      THETISLINK_CHAT_KEYS: ${THETISLINK_CHAT_KEYS:-}
    volumes:
      - relay-data:/data
    # Internal only over the compose network: 18080 = wss tunnel; 18081 = admin API
    # (Caddy routes /admin* here). Neither is published to the host.
    expose:
      - "18080"
      - "18081"
    # Published to the host: UDP 443 for the audio data path (fase 2). This is UDP;
    # Caddy keeps TCP 443 for wss — same port number, different protocol, no conflict.
    ports:
      - "443:443/udp"
    # Migration aid: uncomment to also serve plain ws:// on the host during the switch.
    # ports:
    #   - "18080:18080"

  # Phase 0 of the chat (docs/internal/DESIGN-relay-chat.md). Its own container,
  # its own volume and its own route, so `docker compose up -d --build
  # thetislink-chat` touches nothing else: the relay carries audio and PTT and
  # must keep running across a chat update. The dependency points one way - the
  # chat may need the relay, never the reverse - so there is no depends_on here.
  thetislink-chat:
    build:
      context: ../thetislink-chat
      dockerfile: Dockerfile
    image: thetislink-chat:dev
    container_name: thetislink-chat
    restart: unless-stopped
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      # The key the relay signs tickets with (design §3.3). Never in the repo -
      # set it in .env next to the relay token. Comma-separated to keep two live
      # during a rotation, so changing it needs no relay restart.
      THETISLINK_CHAT_KEYS: ${THETISLINK_CHAT_KEYS:?set THETISLINK_CHAT_KEYS in .env}
      THETISLINK_CHAT_DB: /data/chat.db
      # The administrator credential for the diagnosis postbox, separate from any
      # station ticket (design §1.4). Absent means those paths simply do not
      # exist, which is a chat with no administrator side rather than an open one.
      THETISLINK_CHAT_ADMIN_TOKEN: ${THETISLINK_CHAT_ADMIN_TOKEN:-}
    # Hard limits, not "bounded" (design §2.2). This host has 1.9 GB of RAM and
    # NO SWAP: when memory runs out the kernel kills the biggest process rather
    # than slowing down, and that could be the relay. A capped chat gets killed
    # instead of its neighbour.
    mem_limit: 256m
    cpus: 0.5
    volumes:
      - chat-data:/data
    # Internal only: Caddy routes /chat* here. Never published to the host.
    expose:
      - "18082"

  caddy:
    # Caddyfile is baked into the image (see Dockerfile.caddy) rather than bind-mounted,
    # which avoids the fragile single-file mount. RELAY_DOMAIN is substituted at runtime.
    build:
      context: .
      dockerfile: Dockerfile.caddy
    image: thetislink-caddy:dev
    container_name: thetislink-caddy
    restart: unless-stopped
    environment:
      RELAY_DOMAIN: ${RELAY_DOMAIN:?set RELAY_DOMAIN in .env (your DuckDNS subdomain)}
    ports:
      - "443:443"
      # Port 80 intentionally NOT mapped: taken on this shared VPS. Caddy uses the
      # TLS-ALPN-01 challenge on 443 for the Let's Encrypt certificate.
    volumes:
      # Persist the certificate + ACME account so it is not re-fetched on every restart.
      - caddy-data:/data
      - caddy-config:/config

volumes:
  relay-data:
  chat-data:
  caddy-data:
  caddy-config:
