# No `targets` specified. cargo-about 0.8.4 then lists the crates of every
# platform, not only the build host: run on Windows, the list also names the
# Linux-only crates (alsa-sys, wayland-client, x11-dl, libudev-sys, zbus;
# measured 2026-11-16, all third-party crates of the Linux build). preflight
# checks that this stays so ("licence list covers the Linux build").
# `compliance/sbom.spdx.json` is the full crate inventory.
#
# The regeneration at a release, at the default threshold, the same command
# preflight compares against:
#   cargo about generate about.hbs -o compliance/THIRD-PARTY-LICENSES.html
# Not `--threshold 1.0`: that gives a list well over a thousand lines shorter,
# which preflight then rejects. At the default threshold cargo-about prints
# "ERROR failed to parse license 'GPL-2.0'" (its file scanner reads a deprecated
# bare identifier in some crate's sources) and still exits 0; the list is
# complete. No crate in the tree declares the bare `GPL-2.0` identifier.
#
# The Ubuntu Font License 1.0 (UFL-1.0) attached to epaint_default_fonts
# has no standard SPDX identifier; we clarify the crate's expression
# below to its SPDX-standard components. The UFL-1.0 text is shipped
# separately as `compliance/licenses/UFL-1.0.txt` (see ATTRIBUTION.md).

accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unlicense",
    "CC0-1.0",
    "BSL-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "GPL-2.0-or-later",
    "OFL-1.1",
    "LGPL-2.1-or-later",
    "LGPL-3.0-or-later",
]

# epaint_default_fonts declares
# "(MIT OR Apache-2.0) AND OFL-1.1 AND LicenseRef-UFL-1.0".
# UFL-1.0 (Ubuntu Font License) has no standard SPDX identifier and
# cargo-about cannot resolve it. We clarify the license expression here
# down to its SPDX-standard components. The UFL-1.0 text, and those of the
# two other fonts in this crate that the generated THIRD-PARTY-LICENSES.html
# does not carry (Hack, emoji-icon-font), travel in the release package from
# compliance/licenses/ (NOTICE.md). They do not reach a user through the
# crate: a program carries the font, not the crate's files.
[epaint_default_fonts.clarify]
license = "(MIT OR Apache-2.0) AND OFL-1.1"
override-git-commit = "0.29.1"

[[epaint_default_fonts.clarify.files]]
path = "fonts/OFL.txt"
license = "OFL-1.1"
checksum = "6a73f9541c2de74158c0e7cf6b0a58ef774f5a780bf191f2d7ec9cc53efe2bf2"

# unescaper 0.1.8 declares `license = "GPL-3.0/MIT"` (deprecated slash form,
# with the bare `GPL-3.0` identifier that SPDX has deprecated in favour of
# `GPL-3.0-only` or `GPL-3.0-or-later`). cargo-about 0.8.4 reads it and picks
# MIT on its own (measured 2026-11-17: without this clarification the list is
# byte for byte the same), so this is not a parse fix. It records the choice:
# we pull unescaper in through `serialport` and use the MIT branch of the dual
# licence, which is compatible with our `GPL-2.0-or-later` distribution and
# keeps the GPL-3 question out entirely, also for a stricter cargo-about.
[unescaper.clarify]
license = "MIT"
override-git-commit = "0.1.8"

[[unescaper.clarify.files]]
path = "LICENSE-MIT"
license = "MIT"
checksum = "6e0bad263cbd2aa6235d78e3c26bcfa2668cf32f6b274ae21ce0dd620114c7b3"

# hidapi 2.6.6 declares `license = "MIT"` in its Cargo.toml but ships
# triple-licensing text files in `etc/hidapi/` (LICENSE.txt naming all
# three, plus LICENSE-bsd.txt, LICENSE-gpl3.txt, LICENSE-orig.txt).
# Its own Cargo.toml says MIT, and cargo-about 0.8.4 keeps that without this
# clarification too (measured 2026-11-17). What the clarification adds is
# the text: it points at two files, etc/hidapi/LICENSE.txt (the notice of
# the bundled C library) and the crate's own LICENSE.txt, and without it the
# notice of the C library is not in the list.
#
# Note on the rendered text: etc/hidapi/LICENSE.txt is the notice of the bundled
# C library, offering three licences; which one ThetisLink uses for that C code
# is stated in NOTICE.md (the original HIDAPI licence), not here. The MIT
# selection above is the Rust crate's own licence.
#
# If a new hidapi version changes either file, the checksum no longer matches
# and cargo-about drops this WHOLE clarification with only a warning; the C
# library's notice then silently leaves the list. preflight therefore requires
# both texts in the committed list ("licence texts that must stay in the list").
[hidapi.clarify]
license = "MIT"
override-git-commit = "2.6.6"

[[hidapi.clarify.files]]
path = "etc/hidapi/LICENSE.txt"
license = "MIT"
checksum = "7d3b087c34f35d4d538e3bcddd1ff8f66e92f9ef336881999482800ddf840913"

# The crate's own MIT text ("Copyright 2017 The hidapi-rs Developers"). The entry
# above is the licence statement of the bundled C library; without this one the
# MIT text of the Rust crate itself was missing from THIRD-PARTY-LICENSES.html.
[[hidapi.clarify.files]]
path = "LICENSE.txt"
license = "MIT"
checksum = "778d971f6152990cee1644e7aadcd51a68050dd73f76463c5a9c1863ca495d73"
