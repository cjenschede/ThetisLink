org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# No daemon: it outlives the build and keeps the output handles it inherited
# open, so a caller that waits for the end of the output waits for ever.
# Here and not as a flag, so every Gradle call of the scripts follows it.
org.gradle.daemon=false
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
