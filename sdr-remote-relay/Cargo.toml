[package]
name = "sdr-remote-relay"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
futures-util = "0.3"
log = { workspace = true }
tokio = { workspace = true }
# rustls-tls-webpki-roots: bundles Mozilla CA roots (no OS TLS dep), so wss:// works
# on Windows + Android alike. Lets clients reach a TLS relay (Let's Encrypt cert).
tokio-tungstenite = { version = "0.24", features = ["connect", "rustls-tls-webpki-roots"] }
# tokio-tungstenite does NOT enable a rustls crypto provider, so rustls 0.23 panics
# ("no process-level CryptoProvider") on the first wss connect. Enable the `ring`
# provider explicitly (default-features off avoids also pulling aws-lc-rs, which would
# make it ambiguous). `ring` cross-compiles cleanly to Android. `tls12` said here:
# without it the wss sign-in could speak TLS 1.2 only because another crate in the
# same build (hyper-rustls, through the chat) happened to switch it on. `std` as
# in sdr-remote-quic, for the same reason: here it came from tokio-rustls.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
# Test certificates for the wss:// trust test (already in the tree via sdr-remote-quic).
rcgen = { version = "0.13", default-features = false, features = ["ring", "crypto"] }
