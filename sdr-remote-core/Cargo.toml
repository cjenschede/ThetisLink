[package]
name = "sdr-remote-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
audiopus = { workspace = true }
bytemuck = { workspace = true }
log = { workspace = true }
anyhow = { workspace = true }
# The one anti-alias filter for every downsampler (`resample.rs`, build 259); already
# used by the server and the apps, so no new crate enters the workspace.
rubato = { workspace = true }
num_enum = "0.7"
hmac = "0.12"
sha2 = "0.10"
# Session key derivation (mutual authentication of the direct connection); same family as hmac.
hkdf = "0.12"
rand = "0.8"
totp-lite = "2.0"
base32 = "0.5"

# `audio_stream`: a cpal stream in the device's own sample format, for the
# server and the desktop client. Same crate the two already pull in, so no new
# crate enters the workspace or the SBOM; behind a feature, so the Android build
# of this crate does not compile it.
cpal = { workspace = true, optional = true }

[features]
audio-stream = ["dep:cpal"]

# `oslang`: the OS display language for a first start (GetUserDefaultUILanguage).
# Same crate + version the server and client already pull in, so no new crate
# enters the workspace or the SBOM. Target-gated, so the Android build of this
# crate is untouched.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Globalization"] }

[dev-dependencies]
