[package]
name = "sdr-remote-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ThetisLink-Server"
path = "src/main.rs"

[features]
# The replay of the transmit chain (`--naspelen`, build 246): a tool for the
# developer, never in a release build (owner, 2026-10-12: measuring is
# development). Its module is also compiled for the tests.
naspelen = []

[dependencies]
sdr-remote-core = { path = "../sdr-remote-core" }
sdr-remote-relay = { path = "../sdr-remote-relay" }
sdr-remote-quic = { path = "../sdr-remote-quic" }
sdr-remote-chat = { path = "../sdr-remote-chat" }
vrx-rs = { path = "../vrx-rs" }
tokio = { workspace = true }
cpal = { workspace = true }
ringbuf = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
sdr-remote-theme = { path = "../sdr-remote-theme" }
sdr-remote-layout = { path = "../sdr-remote-layout" }
qrcode = "0.14"
bytemuck = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
anyhow = { workspace = true }
rustfft = "6"
socket2 = "0.5"
serialport = { workspace = true }
chrono = "0.4"
tokio-tungstenite = { version = "0.24", features = ["connect"] }
futures-util = "0.3"
url = "2"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# PATCH-3: mDNS service advertise (`_thetislink._udp.local.`) for
# local-network discovery. Apache-2.0 OR MIT - GPL-2.0-or-later compatible.
# Pure-Rust, no system deps on Windows.
mdns-sd = "=0.19.1"
# Adafruit MCP2221A breakout - used for the StockCorner JC-4s tuner bridge
# (GP0 -> 2N7000 gate for grey-wire start, GP1 -> ADC for yellow tune-status).
# Server only exposes a debug panel for now; full tuner integration is a
# follow-up patch. See docs/internal/referentie/MCP2221A-JC4s-wiring.md.
mcp2221-hal = "0.1"
# UI translations (rust-i18n) - EN as the base (fallback), NL/DE/FR to choose, like the client.
rust-i18n = "3"

# Monitor enumeration for the "Vensters schikken" (arrange windows) grid (multi-monitor snap).
# Only Gdi/HiDpi/Foundation needed (EnumDisplayMonitors + GetDpiForSystem).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
] }

[build-dependencies]
winresource = "0.1"
