srv_arrange_title:
  en: "Arrange windows"
  nl: "Vensters schikken"
  de: "Fenster anordnen"
  fr: "Organiser les fenêtres"
srv_arrange_help:
  en: "Pick a grid size, select a window and paint it onto the cells (click or drag). A window may cover several adjacent cells - it is stretched over that block. Each screen has its own grid."
  nl: "Kies een rasterformaat, selecteer een venster en schilder het in de cellen (klik of sleep). Een venster mag meerdere aangrenzende cellen beslaan - het wordt over dat blok uitgerekt. Elk scherm heeft zijn eigen raster."
  de: "Rastergröße wählen, ein Fenster auswählen und in die Zellen malen (klicken oder ziehen). Ein Fenster darf mehrere benachbarte Zellen belegen - es wird über diesen Block gestreckt. Jeder Bildschirm hat sein eigenes Raster."
  fr: "Choisissez une taille de grille, sélectionnez une fenêtre et peignez-la sur les cellules (clic ou glisser). Une fenêtre peut couvrir plusieurs cellules adjacentes - elle est étirée sur ce bloc. Chaque écran a sa propre grille."
srv_screen:
  en: "Screen:"
  nl: "Scherm:"
  de: "Bildschirm:"
  fr: "Écran :"
srv_screen_n:
  en: "Screen %{n}"
  nl: "Scherm %{n}"
  de: "Bildschirm %{n}"
  fr: "Écran %{n}"
srv_grid:
  en: "Grid:"
  nl: "Raster:"
  de: "Raster:"
  fr: "Grille :"
srv_arrange_pick:
  en: "Window (click to select, then paint into the grid):"
  nl: "Venster (klik om te kiezen, schilder dan in het raster):"
  de: "Fenster (zum Auswählen klicken, dann ins Raster malen):"
  fr: "Fenêtre (cliquez pour choisir, puis peignez dans la grille) :"
srv_arrange_place:
  en: "Click a cell, or drag to fill a rectangle. Right-click or click again to clear."
  nl: "Klik een cel, of sleep om een rechthoek te vullen. Rechtsklik of nogmaals klikken wist."
  de: "Zelle anklicken oder ziehen, um ein Rechteck zu füllen. Rechtsklick oder erneut klicken löscht."
  fr: "Cliquez une cellule, ou glissez pour remplir un rectangle. Clic droit ou nouveau clic pour effacer."
