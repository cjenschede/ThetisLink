srv_pstrotator_hint:
  en: "PstRotator: in 'Communication -> UDP Control Port' set the port above + tick 'UDP Control'. Local firewall: allow inbound UDP on the feedback port."
  nl: "PstRotator: in 'Communication -> UDP Control Port' bovenstaande poort instellen + 'UDP Control' aanvinken. Lokale firewall: inbound UDP feedback-poort toestaan."
  de: "PstRotator: in 'Communication -> UDP Control Port' den obigen Port einstellen + 'UDP Control' aktivieren. Lokale Firewall: eingehendes UDP auf dem Feedback-Port erlauben."
  fr: "PstRotator : dans 'Communication -> UDP Control Port', réglez le port ci-dessus + cochez 'UDP Control'. Pare-feu local : autoriser l'UDP entrant sur le port de retour."
