  nl: "PstRotator listener (parallel)"
  de: "PstRotator-Listener (parallel)"
  fr: "Écouteur PstRotator (parallèle)"
srv_pstrotator_listener_hover:
  en: "Listens on a UDP port for incoming PstRotator azimuth broadcasts (text `AZ:nnn.n` or XML `<AZIMUTH>nnn.n</AZIMUTH>`). Translates them to GoTo commands on the active rotor backend, regardless of which backend is selected above."
  nl: "Luistert op UDP-poort voor inkomende PstRotator azimuth-broadcasts (text `AZ:nnn.n` of XML `<AZIMUTH>nnn.n</AZIMUTH>`). Vertaalt ze naar GoTo-commando's op de actieve rotor-backend, onafhankelijk van welke backend daarboven gekozen is."
  de: "Lauscht an einem UDP-Port auf eingehende PstRotator-Azimut-Broadcasts (Text `AZ:nnn.n` oder XML `<AZIMUTH>nnn.n</AZIMUTH>`). Übersetzt sie in GoTo-Befehle für das aktive Rotor-Backend, unabhängig davon, welches Backend oben gewählt ist."
  fr: "Écoute sur un port UDP les diffusions d'azimut PstRotator (texte `AZ:nnn.n` ou XML `<AZIMUTH>nnn.n</AZIMUTH>`). Les traduit en commandes GoTo sur le backend rotor actif, quel que soit le backend choisi ci-dessus."
srv_pstrotator_loop_warn:
  en: "Note: rotor_backend is also 'pstrotator' - PstRotator's own replies can re-enter via this listener (loop risk)."
  nl: "Let op: rotor_backend is ook 'pstrotator' - PstRotator's eigen replies kunnen via deze listener weer binnenkomen (loop-risico)."
  de: "Hinweis: rotor_backend ist ebenfalls 'pstrotator' - PstRotators eigene Antworten können über diesen Listener zurückkommen (Schleifengefahr)."
  fr: "Note : rotor_backend est aussi 'pstrotator' - les propres réponses de PstRotator peuvent revenir via cet écouteur (risque de boucle)."
srv_relay_enable:
  en: "Enable outbound relay monitor"
  nl: "Uitgaande relay-monitor inschakelen"
  de: "Ausgehenden Relay-Monitor aktivieren"
  fr: "Activer le moniteur de relais sortant"
srv_relay_udp:
  en: "Audio over UDP (low latency)"
  nl: "Audio over UDP (lage latency)"
  de: "Audio über UDP (niedrige Latenz)"
  fr: "Audio sur UDP (faible latence)"
srv_relay_udp_hover:
  en: "Route audio + PTT over plain UDP (port 443) instead of the wss tunnel: no retransmit, lower latency. Both server and client must have it on. Applies on restart."
  nl: "Route audio + PTT over kale UDP (poort 443) i.p.v. de wss-tunnel: geen retransmit, lagere latency. Server en client moeten het beide aan hebben. Geldt na herstart."
  de: "Audio + PTT über reines UDP (Port 443) statt des wss-Tunnels leiten: keine erneute Übertragung, niedrigere Latenz. Server und Client müssen es beide aktiviert haben. Gilt nach Neustart."
  fr: "Router l'audio + PTT sur UDP simple (port 443) au lieu du tunnel wss : pas de retransmission, latence plus faible. Le serveur et le client doivent l'activer. Effectif au redémarrage."
