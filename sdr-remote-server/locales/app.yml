srv_991a_ptt_switch:
  en: "Switch 991A SSB/AM USB routing on PTT"
  nl: "991A SSB/AM USB-routing schakelen op PTT"
  de: "991A SSB/AM USB-Routing bei PTT umschalten"
  fr: "Commuter le routage USB SSB/AM du 991A au PTT"
srv_991a_ptt_switch_hover:
  en: "Off (default): keep 991A USB routing active while a client is connected and restore about 2 s after disconnect (zero PTT delay).\nOn: switch 991A routing only during PTT; useful when you want the hand mic restored immediately outside TX. FTX-1 auto source selection is left unchanged."
  nl: "Uit (standaard): houd 991A USB-routing actief zolang een client verbonden is en herstel ca. 2 s na verbreken (geen PTT-vertraging).\nAan: schakel 991A-routing alleen tijdens PTT; handig als je de handmicrofoon buiten TX meteen terug wilt. FTX-1 auto bronkeuze blijft ongewijzigd."
  de: "Aus (Standard): 991A-USB-Routing aktiv halten, solange ein Client verbunden ist, und ca. 2 s nach dem Trennen wiederherstellen (keine PTT-Verzögerung).\nEin: 991A-Routing nur während PTT umschalten; nützlich, wenn das Handmikrofon außerhalb TX sofort wieder aktiv sein soll. FTX-1 Auto-Quellenwahl bleibt unverändert."
  fr: "Désactivé (par défaut) : garder le routage USB du 991A actif tant qu'un client est connecté et le restaurer environ 2 s après la déconnexion (aucun délai PTT).\nActivé : commuter le routage du 991A uniquement pendant le PTT ; utile pour retrouver aussitôt le micro à main hors TX. La sélection auto de source du FTX-1 reste inchangée."
srv_radio2_note:
  en: "Radio 2 changes: save + restart the server."
  nl: "Radio 2 wijzigingen: opslaan + server herstarten."
  de: "Radio-2-Änderungen: speichern + Server neu starten."
