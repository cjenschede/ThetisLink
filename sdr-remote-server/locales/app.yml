  de: "Aus (Standard): 991A-USB-Routing aktiv halten, solange ein Client verbunden ist, und ca. 2 s nach dem Trennen wiederherstellen (keine PTT-Verzögerung).\nEin: 991A-Routing nur während PTT umschalten; nützlich, wenn das Handmikrofon außerhalb TX sofort wieder aktiv sein soll. FTX-1 Auto-Quellenwahl bleibt unverändert."
