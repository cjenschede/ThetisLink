  de: "Stationsname:"
  fr: "Nom de station :"
srv_relay_token:
  en: "Relay token:"
  nl: "Relay-token:"
  de: "Relay-Token:"
  fr: "Jeton de relais :"
srv_relay_desc:
  en: "Relay routes the full connection: audio + PTT over UDP with automatic wss (TCP) fallback, control + spectrum over wss. Both server and client must use the same relay, station name and token."
  nl: "Relay routeert de volledige verbinding: audio + PTT over UDP met automatische wss (TCP) fallback, controle + spectrum over wss. Server en client moeten dezelfde relay, stationsnaam en token gebruiken."
  de: "Relay leitet die gesamte Verbindung: Audio + PTT über UDP mit automatischem wss-(TCP)-Fallback, Steuerung + Spektrum über wss. Server und Client müssen denselben Relay, Stationsnamen und Token verwenden."
  fr: "Le relais achemine toute la connexion : audio + PTT sur UDP avec repli wss (TCP) automatique, contrôle + spectre sur wss. Le serveur et le client doivent utiliser le même relais, nom de station et jeton."
