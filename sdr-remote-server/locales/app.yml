  de: "Erteilt die Erlaubnis und setzt das Haekchen in den Einstellungen. Jederzeit wieder abwaehlbar."
  fr: "Accorde l'autorisation et coche la case dans les reglages. Vous pouvez la decocher a tout moment."
srv_ftx1_mem_write_note:
  en: "The FTX-1 resets the CTCSS tone of every channel it writes to 100.0 Hz, and has no CAT command to put it back. Tones set on the radio by hand are lost on the channels written. ThetisLink keeps the real tones in its own list and applies them each time the radio lands on a channel, so transmitting through ThetisLink still works - but the radio on its own, without ThetisLink, will transmit 100.0 Hz. Leave this off and *Write radio* still hands your list to the server - the tones in it are applied per channel, so they work - but nothing is written into the radio. What you then give up is that a frequency or name you edit lives in the server's list and not in the set. Reading is always allowed. The FT-991A is unaffected."
  nl: "De FTX-1 zet de CTCSS-toon van elk kanaal dat hij schrijft terug op 100,0 Hz en heeft geen CAT-commando om die terug te zetten. Tonen die met de hand op de radio zijn gezet, zijn op de geschreven kanalen weg. ThetisLink bewaart de echte tonen in zijn eigen lijst en zet ze telkens als de radio op een kanaal komt, dus zenden via ThetisLink blijft werken - maar de radio alleen, zonder ThetisLink, zendt 100,0 Hz uit. Laat dit uit staan, dan geeft *Write radio* je lijst nog steeds aan de server - de tonen erin worden per kanaal gezet, dus die werken - maar er wordt niets in de radio geschreven. Wat je dan opgeeft: een frequentie of naam die je hier wijzigt staat in de lijst van de server en niet in de set. Lezen mag altijd. De FT-991A heeft hier geen last van."
  de: "Der FTX-1 setzt den CTCSS-Ton jedes geschriebenen Kanals auf 100,0 Hz zurueck und hat keinen CAT-Befehl, um ihn wiederherzustellen. Von Hand am Geraet gesetzte Toene gehen auf den geschriebenen Kanaelen verloren. ThetisLink haelt die echten Toene in seiner eigenen Liste und setzt sie bei jedem Kanalwechsel, Senden ueber ThetisLink funktioniert also weiterhin - das Geraet allein, ohne ThetisLink, sendet jedoch 100,0 Hz. Bleibt dies aus, uebergibt *Write radio* die Liste weiterhin an den Server - die Toene darin werden pro Kanal gesetzt und funktionieren also -, aber in das Geraet wird nichts geschrieben. Der Preis: eine hier geaenderte Frequenz oder ein Name steht in der Serverliste und nicht im Geraet. Lesen ist immer erlaubt. Der FT-991A ist nicht betroffen."
  fr: "Le FTX-1 remet a 100,0 Hz la tonalite CTCSS de chaque memoire qu'il ecrit, et n'a aucune commande CAT pour la retablir. Les tonalites reglees a la main sur le poste sont perdues sur les memoires ecrites. ThetisLink conserve les vraies tonalites dans sa propre liste et les applique chaque fois que le poste arrive sur une memoire : l'emission via ThetisLink continue donc de fonctionner, mais le poste seul, sans ThetisLink, emettra 100,0 Hz. Si vous laissez ceci desactive, *Write radio* transmet toujours votre liste au serveur - les tonalites qu'elle contient sont appliquees memoire par memoire et fonctionnent donc - mais rien n'est ecrit dans le poste. La contrepartie : une frequence ou un nom modifie ici figure dans la liste du serveur et pas dans le poste. La lecture reste toujours possible. Le FT-991A n'est pas concerne."
srv_ftx1_mem_write_ack_hover:
  en: "Off by default. Reading the FTX-1's memory is always allowed - only writing is gated."
  nl: "Standaard uit. Het lezen van het FTX-1-geheugen mag altijd - alleen schrijven zit achter deze vink."
  de: "Standardmaessig aus. Das Lesen des FTX-1-Speichers ist immer erlaubt - nur das Schreiben ist gesperrt."
  fr: "Desactive par defaut. La lecture des memoires du FTX-1 est toujours permise - seule l'ecriture est verrouillee."
