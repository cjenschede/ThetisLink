  fr: "Écoute sur un port UDP les diffusions d'azimut PstRotator (texte `AZ:nnn.n` ou XML `<AZIMUTH>nnn.n</AZIMUTH>`). Les traduit en commandes GoTo sur le backend rotor actif, quel que soit le backend choisi ci-dessus."
